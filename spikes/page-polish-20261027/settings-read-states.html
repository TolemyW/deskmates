<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings read recovery · Local visual audit</title></head><body><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { App } from '/src/app.tsx';
import { installMockGateway } from '/src/demo/install.ts';
import '/src/styles/index.ts';
installMockGateway();
const mockFetch = window.fetch.bind(window);
const area = new URLSearchParams(location.search).get('area') ?? 'bot';
const failed = new Set();
const targets = area === 'costs' ? ['/api/cost-alerts', '/api/cost-alert-rules'] : ['/api/integrations/workspaces/ws_0001/connections'];
window.fetch = async (input, init) => {
  const url = new URL(typeof input === 'string' ? input : input.url ?? String(input), location.origin);
  const method = init?.method ?? 'GET';
  const json = (body, status=200) => new Response(JSON.stringify(body), {status, headers:{'content-type':'application/json'}});
  if (method !== 'GET') return json({code:'preview_only',message:'Read-only visual fixture'},403);
  if (targets.includes(url.pathname) && !failed.has(url.pathname)) {
    failed.add(url.pathname);
    return json({code:'unavailable',message:'Temporarily unable to load this list.'},503);
  }
  return mockFetch(input, init);
};
location.hash = area === 'costs' ? '#/costs' : '#/contacts/bot_0002';
createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
